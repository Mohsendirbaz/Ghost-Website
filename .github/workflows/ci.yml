name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: CI=false DISABLE_ESLINT_PLUGIN=true npm run build
      - name: Tests
        run: CI=true DISABLE_ESLINT_PLUGIN=true npx react-scripts test --watchAll=false
      - name: Exhibition bundle is coverage-free
        run: node scripts/assertExhibitionClean.js
