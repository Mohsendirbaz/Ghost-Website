<rect x="6" y="6" width="1228" height="648" fill="none" stroke="#0b2239" stroke-width="1.5"/>
<path d="M6 26h20M26 6v20 M1234 26h-20M1214 6v20 M6 634h20M26 654v-20 M1234 634h-20M1214 654v-20" stroke="#0b2239" stroke-width="1.5" fill="none"/>
<text x="30" y="42" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#8a8983">FIG. A-01 · ARCHITECTURE / THESIS</text>
<text x="30" y="72" font-size="26" font-weight="650" fill="#0b2239">Two Invariants — every blueprint is an instance of both</text>
<text x="140" y="166" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#2a78d6">I. POSE-AND-SELECT</text><line x1="150" y1="330" x2="311" y2="176" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="311" cy="176" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="343" y2="222" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="343" cy="222" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="363" y2="274" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="363" cy="274" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="370" y2="330" stroke="#2a78d6" stroke-width="3" opacity="1"/><circle cx="370" cy="330" r="7" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="363" y2="386" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="363" cy="386" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="343" y2="438" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="343" cy="438" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><line x1="150" y1="330" x2="311" y2="484" stroke="#2a78d6" stroke-width="1.4" opacity="0.45"/><circle cx="311" cy="484" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><circle cx="150" cy="330" r="10" fill="#0b2239"/><text x="110" y="510" font-size="13" fill="#52514e">Enumerate the configuration space; select</text><text x="110" y="527" font-size="13" fill="#52514e">which blocks, routes, data and agents to</text><text x="110" y="544" font-size="13" fill="#52514e">activate — under a budget. The same act at</text><text x="110" y="561" font-size="13" fill="#52514e">four scales: design, run time, data plane,</text><text x="110" y="578" font-size="13" fill="#52514e">agent fabric.</text><text x="760" y="166" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#4a3aa7">II. MONOTONE CONSEQUENCE LAW</text><path d="M760 200 L1140 290 L1140 370 L760 460 Z" fill="#4a3aa7" opacity="0.10"/><path d="M760 200 L1140 290 M760 460 L1140 370" stroke="#4a3aa7" stroke-width="2.4"/><line x1="760" y1="490" x2="1140" y2="490" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><text x="760" y="512" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">risk rises →</text><text x="910" y="336" font-size="13" fill="#4a3aa7" font-family="ui-monospace,'SF Mono',Menlo,monospace">admissible set only contracts</text><text x="740" y="544" font-size="13" fill="#52514e">Selection is free; consequence is bounded.</text><text x="740" y="561" font-size="13" fill="#52514e">S0→S4 refusal, safe-side rounding — the</text><text x="740" y="578" font-size="13" fill="#52514e">gearbox ranks the admissible set and never</text><text x="740" y="595" font-size="13" fill="#52514e">enlarges it.</text><line x1="620" y1="140" x2="620" y2="560" stroke="#dfe6ee" stroke-width="2"/><text x="30" y="636" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">Relation triples per G8 from the Master Blueprint of Blueprints — the register&#x27;s two laws, drawn</text></svg>