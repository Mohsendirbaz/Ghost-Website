<text x="30" y="72" font-size="26" font-weight="650" fill="#0b2239">Metabolic Memory — slower memory is not safer memory</text>
<rect x="90" y="180" width="420" height="84" rx="7" fill="#2a78d6" opacity="0.12"/><rect x="90" y="180" width="420" height="84" rx="7" fill="none" stroke="#2a78d6" stroke-width="2.2"/><text x="108" y="208" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#0b2239">REFLEXIVE</text><text x="248" y="208" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#4a3aa7">τ &lt; 100 ms</text><text x="108" y="230" font-size="12.5" fill="#52514e">validity predicate: physical admissibility</text><text x="108" y="250" font-size="12.5" fill="#52514e">ring buffers — overwritten instantly</text><rect x="90" y="292" width="680" height="84" rx="7" fill="#2a78d6" opacity="0.22"/><rect x="90" y="292" width="680" height="84" rx="7" fill="none" stroke="#2a78d6" stroke-width="2.2"/><text x="108" y="320" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#0b2239">TACTICAL</text><text x="248" y="320" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#4a3aa7">100 ms – 5 s</text><text x="108" y="342" font-size="12.5" fill="#52514e">validity predicate: trajectory consensus</text><text x="108" y="362" font-size="12.5" fill="#52514e">short-term store — ODD-scoped</text><rect x="90" y="404" width="940" height="84" rx="7" fill="#2a78d6" opacity="0.32"/><rect x="90" y="404" width="940" height="84" rx="7" fill="none" stroke="#2a78d6" stroke-width="2.2"/><text x="108" y="432" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#0b2239">STRATEGIC</text><text x="248" y="432" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#4a3aa7">τ ≥ 5 s</text><text x="108" y="454" font-size="12.5" fill="#52514e">validity predicate: cross-modal agreement + provenance</text><text x="108" y="474" font-size="12.5" fill="#52514e">gated rewriting of network weights</text><line x1="1058" y1="190" x2="1058" y2="480" stroke="#e34948" stroke-width="3" marker-end="url(#arr)"/><text x="1074" y="300" font-size="12" font-weight="600" fill="#e34948">verification burden,</text><text x="1074" y="318" font-size="12" font-weight="600" fill="#e34948">provenance and</text><text x="1074" y="336" font-size="12" font-weight="600" fill="#e34948">anti-drift obligations</text><text x="1074" y="354" font-size="12" font-weight="600" fill="#e34948">strengthen</text><text x="1074" y="372" font-size="12" font-weight="600" fill="#e34948">monotonically with τ</text><text x="90" y="552" font-size="15" font-weight="650" fill="#0b2239">The blast radius of a corrupt datum grows with residence time — so the burden of proof grows with it.</text><text x="30" y="616" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">G11 record from the Metabolic Memory Architecture specification · thresholds are design budgets (proposed)</text></svg>