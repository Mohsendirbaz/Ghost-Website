<text x="30" y="72" font-size="26" font-weight="650" fill="#0b2239">Provable Structure, Bounded Claims — the five-stage pipeline</text>
<rect x="80" y="140" width="196" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.4"/><text x="94" y="169" font-size="15" font-weight="650" fill="#0b2239">CCA</text><text x="94" y="192" font-size="11.5" fill="#52514e">multi-block integration</text><line x1="278" y1="175" x2="304" y2="175" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><rect x="308" y="140" width="196" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.4"/><text x="322" y="169" font-size="15" font-weight="650" fill="#0b2239">Hellinger</text><text x="322" y="192" font-size="11.5" fill="#52514e">compositional embedding</text><line x1="506" y1="175" x2="532" y2="175" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><rect x="536" y="140" width="196" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.4"/><text x="550" y="169" font-size="15" font-weight="650" fill="#0b2239">Sequence lift</text><text x="550" y="192" font-size="11.5" fill="#52514e">fixed nonlinear</text><line x1="734" y1="175" x2="760" y2="175" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><rect x="764" y="140" width="196" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.4"/><text x="778" y="169" font-size="15" font-weight="650" fill="#0b2239">Trace features</text><text x="778" y="192" font-size="11.5" fill="#52514e">similarity-invariant</text><line x1="962" y1="175" x2="988" y2="175" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><rect x="992" y="140" width="196" height="70" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.4"/><text x="1006" y="169" font-size="15" font-weight="650" fill="#0b2239">AGM / elliptic</text><text x="1006" y="192" font-size="11.5" fill="#52514e">pole–zero–gain → ξ, S</text><rect x="80" y="260" width="640" height="64" rx="6" fill="none" stroke="#1baf7a" stroke-width="2.4"/><text x="96" y="286" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#0e7a55">PROVEN — solid outline</text><text x="96" y="306" font-size="12" fill="#52514e">AGM converges quadratically to machine precision; single-valued pipeline; stated</text><text x="96" y="320" font-size="12" fill="#52514e">equivariances; exact balance identities</text><rect x="80" y="344" width="640" height="64" rx="6" fill="#1baf7a" opacity="0.16"/><rect x="80" y="344" width="640" height="64" rx="6" fill="none" stroke="#1baf7a" stroke-width="2.4"/><text x="96" y="370" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#0e7a55">MEASURED — preliminary, in-envelope</text><text x="96" y="390" font-size="12" fill="#52514e">R² ≈ 0.78–0.87 on the gasification case study</text><rect x="80" y="428" width="640" height="64" rx="6" fill="url(#hatch)" opacity="0.5"/><rect x="80" y="428" width="640" height="64" rx="6" fill="none" stroke="#e34948" stroke-width="2.2" stroke-dasharray="6 4"/><text x="96" y="454" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#e34948">NOT CLAIMED</text><text x="96" y="474" font-size="12" fill="#52514e">no conservation-by-construction · no physical meaning for intermediates · no</text><text x="96" y="488" font-size="12" fill="#52514e">extrapolation beyond the envelope</text><rect x="790" y="270" width="380" height="230" fill="url(#hatch)" opacity="0.35"/><rect x="842" y="304" width="262" height="144" fill="#fcfcfb"/><rect x="842" y="304" width="262" height="144" fill="none" stroke="#0b2239" stroke-width="2"/><text x="850" y="292" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#52514e">demonstrated envelope · 600–900 °C</text><text x="960" y="470" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#e34948">outside: no claim</text><circle cx="935" cy="341" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="1000" cy="333" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="977" cy="363" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="882" cy="377" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="877" cy="369" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="884" cy="335" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="955" cy="409" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="895" cy="348" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="995" cy="421" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="846" y="522" font-size="12" fill="#52514e">R² 0.78–0.87 · reported preliminary</text><g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#52514e"><rect x="80" y="669" width="22" height="12" rx="2" fill="#2a78d6"/><text x="108" y="679">measured</text><rect x="230" y="669" width="22" height="12" rx="2" fill="none" stroke="#2a78d6" stroke-width="2"/><text x="258" y="679">proven</text><rect x="380" y="669" width="22" height="12" rx="2" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 3"/><text x="408" y="679">projected</text><rect x="530" y="669" width="22" height="12" rx="2" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1.2"/><text x="558" y="679">proposed</text></g><text x="30" y="696" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">G11 record from the June 2026 revised manuscript; the non-claims band is part of the result</text></svg>