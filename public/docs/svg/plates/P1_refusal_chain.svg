<text x="30" y="42" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#8a8983">FIG. S-01 · SAFETY / REFUSAL CHAIN</text>
<text x="30" y="72" font-size="26" font-weight="650" fill="#0b2239">The Architecture of Refusal — each stage can only narrow the next</text>
<rect x="80" y="118" width="204" height="108" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4"/><text x="94" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#4a3aa7">S0</text><text x="94" y="168" font-size="13" font-weight="650" fill="#0b2239">Trusted sensing &amp;</text><text x="94" y="183" font-size="13" font-weight="650" fill="#0b2239">numerics</text><text x="94" y="198" font-size="10.8" fill="#52514e">Every number honest; rounding</text><text x="94" y="211" font-size="10.8" fill="#52514e">biased to the safe side</text><line x1="284" y1="172" x2="306" y2="172" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><line x1="182.0" y1="226" x2="182.0" y2="300" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="308" y="118" width="204" height="108" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4"/><text x="322" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#4a3aa7">S1</text><text x="322" y="168" font-size="13" font-weight="650" fill="#0b2239">Fidelity gate — scalar φ</text><text x="322" y="198" font-size="10.8" fill="#52514e">Discarded detail can only shrink</text><text x="322" y="211" font-size="10.8" fill="#52514e">the admissible set</text><line x1="512" y1="172" x2="534" y2="172" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><line x1="410.0" y1="226" x2="410.0" y2="300" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="536" y="118" width="204" height="108" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4"/><text x="550" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#4a3aa7">S2</text><text x="550" y="168" font-size="13" font-weight="650" fill="#0b2239">Layered safety filter</text><text x="550" y="198" font-size="10.8" fill="#52514e">Reduced-model guarantee projects</text><text x="550" y="211" font-size="10.8" fill="#52514e">onto the vehicle</text><line x1="740" y1="172" x2="762" y2="172" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><line x1="638.0" y1="226" x2="638.0" y2="300" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="764" y="118" width="204" height="108" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.4" stroke-dasharray="6 4"/><text x="778" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#4a3aa7">S3</text><text x="778" y="168" font-size="13" font-weight="650" fill="#0b2239">Risk-monotone algebra</text><text x="778" y="198" font-size="10.8" fill="#52514e">Meet-composed convex projection;</text><text x="778" y="211" font-size="10.8" fill="#52514e">rate clamp last</text><line x1="968" y1="172" x2="990" y2="172" stroke="#0b2239" stroke-width="2" marker-end="url(#arr)"/><line x1="866.0" y1="226" x2="866.0" y2="300" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="3 4"/><rect x="992" y="118" width="204" height="108" rx="7" fill="#2a78d6" stroke="#2a78d6" stroke-width="2.4"/><text x="1006" y="146" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#cfe3ff">S4</text><text x="1006" y="168" font-size="13" font-weight="650" fill="#ffffff">Analog veto</text><text x="1006" y="198" font-size="10.8" fill="#e8f0fb">Electrically isolated; reaches</text><text x="1006" y="211" font-size="10.8" fill="#e8f0fb">the actuator first</text><line x1="1094.0" y1="226" x2="1094.0" y2="300" stroke="#8a8983" stroke-width="1.4" stroke-dasharray="3 4"/><path d="M80 306 L1196 398 L1196 436 L80 564 Z" fill="#2a78d6" opacity="0.10"/><path d="M80 306 L1196 398 M80 564 L1196 436" stroke="#2a78d6" stroke-width="2.4" fill="none"/><text x="94" y="440" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" fill="#2a78d6">admissible command set</text><circle cx="1192" cy="417" r="9" fill="#e34948"/><circle cx="1192" cy="417" r="14" fill="none" stroke="#e34948" stroke-width="2.4"/><rect x="990" y="494" width="210" height="32" rx="4" fill="#1baf7a"/><text x="1002" y="515" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" font-weight="700" fill="#ffffff">~32 ns veto · MEASURED</text><text x="80" y="620" font-size="15.5" font-weight="650" fill="#0b2239">One law: as warrant falls, the set of admissible commands only ever contracts.</text><text x="80" y="644" font-size="12.5" fill="#52514e">Enforcement ends in electricity, not code — the only latency the corpus reports as measured.</text><g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#52514e"><rect x="80" y="705" width="22" height="12" rx="2" fill="#2a78d6"/><text x="108" y="715">measured</text><rect x="230" y="705" width="22" height="12" rx="2" fill="none" stroke="#2a78d6" stroke-width="2"/><text x="258" y="715">proven</text><rect x="380" y="705" width="22" height="12" rx="2" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 3"/><text x="408" y="715">projected</text><rect x="530" y="705" width="22" height="12" rx="2" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1.2"/><text x="558" y="715">proposed</text></g><text x="30" y="736" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">Distilled per G11 (schema-guided extraction) from the Ten Foundational Articles + refusal one-pager · all other figures projected</text></svg>