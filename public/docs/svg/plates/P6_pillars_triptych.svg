<rect x="6" y="6" width="1228" height="548" fill="none" stroke="#0b2239" stroke-width="1.5"/>
<path d="M6 26h20M26 6v20 M1234 26h-20M1214 6v20 M6 534h20M26 554v-20 M1234 534h-20M1214 554v-20" stroke="#0b2239" stroke-width="1.5" fill="none"/>
<text x="30" y="42" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#8a8983">FIG. H-01 · HOME / PILLARS</text>
<text x="30" y="72" font-size="26" font-weight="650" fill="#0b2239">The Program in Three Verbs</text>
<rect x="90" y="120" width="350" height="330" rx="8" fill="none" stroke="#2a78d6" stroke-width="2.4"/><g transform="translate(265,230)"><line x1="0" y1="0" x2="35" y2="-61" stroke="#2a78d6" stroke-width="1.6" opacity="0.45"/><line x1="0" y1="0" x2="61" y2="-35" stroke="#2a78d6" stroke-width="1.6" opacity="0.45"/><line x1="0" y1="0" x2="70" y2="0" stroke="#2a78d6" stroke-width="4" opacity="1"/><line x1="0" y1="0" x2="61" y2="35" stroke="#2a78d6" stroke-width="1.6" opacity="0.45"/><line x1="0" y1="0" x2="35" y2="61" stroke="#2a78d6" stroke-width="1.6" opacity="0.45"/><circle r="8" fill="#2a78d6"/></g><text x="114" y="330" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#2a78d6">FORMULATE</text><text x="114" y="356" font-size="15" font-weight="650" fill="#0b2239">Pose-and-select</text><text x="114" y="380" font-size="12.5" fill="#52514e">Every instant is a formulation choice —</text><text x="114" y="396" font-size="12.5" fill="#52514e">enumerate, then select under budget.</text><rect x="480" y="120" width="350" height="330" rx="8" fill="none" stroke="#4a3aa7" stroke-width="2.4"/><g transform="translate(655,230)"><path d="M-110 -50 L110 -14 M-110 50 L110 14" stroke="#4a3aa7" stroke-width="3"/><path d="M-110 -50 L110 -14 L110 14 L-110 50Z" fill="#4a3aa7" opacity="0.10"/><circle cx="110" cy="0" r="7" fill="#e34948"/></g><text x="504" y="330" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#4a3aa7">ENFORCE</text><text x="504" y="356" font-size="15" font-weight="650" fill="#0b2239">Monotone consequence law</text><text x="504" y="380" font-size="12.5" fill="#52514e">As warrant falls the admissible set only</text><text x="504" y="396" font-size="12.5" fill="#52514e">contracts — ending in the analog veto.</text><rect x="870" y="120" width="350" height="330" rx="8" fill="none" stroke="#1baf7a" stroke-width="2.4"/><g transform="translate(1045,230)"><rect x="-100" y="-46" width="200" height="26" rx="4" fill="#1baf7a" opacity="0.16" stroke="#1baf7a" stroke-width="1.6"/><rect x="-76" y="-26" width="152" height="26" rx="4" fill="#1baf7a" opacity="0.32" stroke="#1baf7a" stroke-width="1.6"/><rect x="-52" y="-6" width="104" height="26" rx="4" fill="#1baf7a" opacity="0.48" stroke="#1baf7a" stroke-width="1.6"/></g><text x="894" y="330" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#1baf7a">REMEMBER</text><text x="894" y="356" font-size="15" font-weight="650" fill="#0b2239">Metabolic memory</text><text x="894" y="380" font-size="12.5" fill="#52514e">Recall is budgeted and priced; slower</text><text x="894" y="396" font-size="12.5" fill="#52514e">memory carries a heavier burden of proof.</text><text x="30" y="536" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" fill="#52514e">Keyphrase distillation per G9; one extractive sentence per pillar per G1</text></svg>