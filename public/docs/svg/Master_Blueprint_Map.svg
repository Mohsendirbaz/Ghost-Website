  <rect x="70"  y="290" width="250" height="150" rx="11" class="mod"/>
  <text x="84" y="314" class="ttls">BP-3 · Metabolic Memory</text>
  <text x="84" y="332" class="sub">reflexive / tactical / strategic</text>
  <text x="84" y="348" class="sub">shadow-price retrieval;</text>
  <text x="84" y="363" class="sub">fidelity = enforced causality</text>
  <text x="84" y="404" class="src">MM · BA</text>
  <text x="84" y="424" class="sub">Memory · Math · Memristor</text>
  <text x="306" y="312" class="src" text-anchor="end">△</text>

  <rect x="335" y="290" width="250" height="150" rx="11" class="mod"/>
  <text x="349" y="314" class="ttls">BP-4 · Memristive Substrate</text>
  <text x="349" y="332" class="sub">fast tiers below latency floor;</text>
  <text x="349" y="348" class="sub">analog/digital at τ = 5 s;</text>
  <text x="349" y="363" class="sub">monotonicity = kill criterion</text>
  <text x="349" y="404" class="src">BA · MM · 10A</text>
  <text x="349" y="424" class="sub">Memristor · Math · Memory</text>
  <text x="571" y="312" class="src" text-anchor="end">◆</text>

  <rect x="600" y="290" width="250" height="150" rx="11" class="mod"/>
  <text x="614" y="314" class="ttls">BP-5 · Physics Anchor φ</text>
  <text x="614" y="332" class="sub">conservation licenses the</text>
  <text x="614" y="348" class="sub">causal re-weighting; ξ, S</text>
  <text x="614" y="363" class="sub">scalars → S1 gate</text>
  <text x="614" y="404" class="src">BA · 10A · GBX</text>
  <text x="614" y="424" class="sub">Math</text>
  <text x="836" y="312" class="src" text-anchor="end">△✓</text>

  <rect x="865" y="290" width="245" height="150" rx="11" class="mod"/>
  <text x="879" y="314" class="ttls">BP-6 · Inter-Agent Fabric</text>
  <text x="879" y="332" class="sub">Byzantine consensus + the</text>
  <text x="879" y="348" class="sub">LLM ↔ virgin agent spectrum;</text>
  <text x="879" y="363" class="sub">on-chip Worker→Manager→Queen</text>
  <text x="879" y="404" class="src">175 · RS · ARC · BA</text>
  <text x="879" y="424" class="sub">Multi-agent · Memory · Math</text>
  <text x="1096" y="312" class="src" text-anchor="end">✓◆</text>

  <!-- math spine base -->
  <path class="eN" d="M195 470 V444" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <path class="eN" d="M460 470 V444" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <path class="eN" d="M725 470 V444" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <path class="eN" d="M987 470 V444" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <rect x="70" y="470" width="1040" height="62" rx="11" fill="var(--color-text-primary)" fill-opacity="0.05" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="84" y="492" class="ttls">BP-7 · Mathematical Foundations Spine  <tspan class="src">GBX · MM · BA · KTE   ✓△</tspan></text>
  <text x="84" y="514" class="sub">monotone/convex projection · manifold geometry · symplectic + posit/quire · PMP finite-time recurrence · superstructure MINLP · the route algebra</text>

  <!-- governance overlay -->
  <rect x="70" y="546" width="1040" height="40" rx="9" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="84" y="571" class="sub"><tspan font-weight="700">BP-8 · Evidentiary &amp; Learning-Governance overlay</tspan>  — governs every box above: known/claimed seam · LLC-quarantine anti-drift · training ⟂ inference · standards crosswalk   <tspan class="src">10A·BA·MM·KTE ✓</tspan></text>

  <!-- gearbox locus + legends -->
  <line x1="30" y1="606" x2="1150" y2="606" class="eN" stroke-opacity="0.4"/>
  <text x="30" y="628" class="sub"><tspan font-weight="700" class="vtxt">Gearbox locus:</tspan>  BP-2 (engine) · judged vs BP-3 · bounded by BP-1 · realized on BP-4 · anchored by BP-5 · distributed via BP-6 · proven by BP-7 · governed by BP-8</text>
  <text x="30" y="652" class="sub"><tspan font-weight="700">Two laws:</tspan>  every blueprint is a <tspan class="vtxt" font-weight="700">pose-and-select</tspan> act over a superstructure, bounded by the <tspan font-weight="700">monotone</tspan> consequence law.</text>

  <text x="30" y="690" class="src">Sources:  KTE Knowledge-Transformation Eng · MM Metabolic Memory · BA Bounded-Autonomy/Memristive · 10A Ten Articles</text>
  <text x="30" y="708" class="src">          175 175-step bundle · RS Refinement Schedule (F1–F26) · ARC Archipelago · GBX prior gearbox work</text>
  <text x="30" y="732" class="src">Pillars covered:  Math (BP-1,2,4,5,7) · Memory (BP-3,6,8) · Multi-agent (BP-2,6) · Memristor (BP-3,4) · KTE (BP-0,2,7)</text>
