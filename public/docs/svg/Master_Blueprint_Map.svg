<svg viewBox="0 0 1180 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="var(--font-sans), system-ui, sans-serif">
  <title id="t">Master Blueprint of Blueprints — relationship map</title>
  <desc id="d">Nine blueprints organized by two invariants. BP-0 the KTE superstructure meta-optimizer presides and sequences the rest. BP-2 the pose-and-select gearbox engine and BP-1 the monotone consequence spine are the two laws. BP-3 metabolic memory, BP-4 memristive substrate, BP-5 physics trust anchor, and BP-6 inter-agent fabric are the organs. BP-7 mathematical foundations is the spine beneath them and BP-8 the evidentiary governance overlay above them all. Each box lists the documents it synthesizes and its standing.</desc>

  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-border-secondary)"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7F77DD"/></marker>
  </defs>

  <style>
    .mod  { fill: var(--color-background-primary); stroke: var(--color-border-secondary); stroke-width:1.5; }
    .ttl  { fill: var(--color-text-primary);   font-size:13.5px; font-weight:700; }
    .ttls { fill: var(--color-text-primary);   font-size:12.5px; font-weight:700; }
    .sub  { fill: var(--color-text-secondary); font-size:10.5px; }
    .src  { fill: var(--color-text-info); font-size:10px; font-family: var(--font-mono), monospace; }
    .band { fill: var(--color-text-secondary); font-size:11px; font-weight:700; letter-spacing:1.2px; }
    .lg   { fill: var(--color-text-secondary); font-size:10px; }
    .eN   { stroke: var(--color-border-secondary); stroke-width:1.5; fill:none; }
    .eV   { stroke:#7F77DD; stroke-width:2; fill:none; }
    .vtxt { fill:#3C3489; }
  </style>

  <text x="30" y="24" class="band">MASTER BLUEPRINT OF BLUEPRINTS · 9 blueprints · 2 laws · 1 meta-method</text>
  <text x="724" y="24" class="lg">standing:  ✓ established   △ proposed   ◆ gamble</text>
  <rect x="1058" y="15" width="13" height="9" rx="2" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD"/>
  <text x="1077" y="23" class="lg" text-anchor="start">law / gearbox</text>

  <!-- BP-0 presiding -->
  <rect x="250" y="44" width="680" height="58" rx="12" fill="#7F77DD" fill-opacity="0.12" stroke="#7F77DD" stroke-width="2"/>
  <text x="270" y="68" class="ttl vtxt">BP-0 · Superstructure Meta-Optimizer  (KTE-as-method)</text>
  <text x="270" y="86" class="sub">design run as one superstructure — selects &amp; sequences the eight below · emits this BoB</text>
  <text x="912" y="64" class="src" text-anchor="end" fill="#534AB7">△</text>
  <text x="912" y="88" class="src" text-anchor="end" fill="#534AB7">KTE·RS·ARC</text>
  <path class="eV" d="M590 102 V140" marker-end="url(#aV)"/>

  <!-- two laws -->
  <text x="30" y="132" class="band">THE TWO INVARIANTS</text>
  <rect x="150" y="146" width="430" height="104" rx="12" fill="#7F77DD" fill-opacity="0.12" stroke="#7F77DD" stroke-width="2"/>
  <circle cx="196" cy="196" r="20" fill="var(--color-background-primary)" stroke="#7F77DD" stroke-width="2"/><circle cx="196" cy="196" r="3.5" fill="#7F77DD"/><line x1="196" y1="196" x2="210" y2="183" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>
  <text x="232" y="174" class="ttls vtxt">BP-2 · Pose-and-Select Engine</text>
  <text x="232" y="192" class="sub" font-weight="700">★ the training-phase gearbox</text>
  <text x="232" y="208" class="sub">325-route formulation selector; switch model-class, adapt online</text>
  <text x="232" y="232" class="src" fill="#534AB7">ARC · GBX · KTE</text>
  <text x="562" y="170" class="src" text-anchor="end" fill="#534AB7">△</text>

  <rect x="620" y="146" width="430" height="104" rx="12" fill="#7F77DD" fill-opacity="0.12" stroke="#7F77DD" stroke-width="2"/>
  <text x="640" y="174" class="ttls vtxt">BP-1 · Monotone Consequence Spine</text>
  <text x="640" y="192" class="sub" font-weight="700">S0 → S4 architecture of refusal</text>
  <text x="640" y="208" class="sub">antitone: falling warrant only contracts the admissible set; analog veto</text>
  <text x="640" y="232" class="src" fill="#534AB7">10A · BA · GBX</text>
  <text x="1032" y="170" class="src" text-anchor="end" fill="#534AB7">△✓</text>

  <line x1="580" y1="198" x2="620" y2="198" class="eV" stroke-dasharray="4 3"/>
  <text x="600" y="190" class="lg" text-anchor="middle">⟂</text>

  <!-- laws shape organs -->
  <path class="eN" d="M300 250 V286" marker-end="url(#aN)"/>
  <path class="eN" d="M520 250 V270 H470 V286" marker-end="url(#aN)"/>
  <path class="eN" d="M740 250 V270 H700 V286" marker-end="url(#aN)"/>
  <path class="eN" d="M900 250 V286" marker-end="url(#aN)"/>

  <!-- organs -->
