<style>

<h1>Epistemic Gearbox — Stack Schematic</h1>
<p class="note">Ghost Autonomy blueprint diagram — evidentiary standings (established / proposed / gamble) are part of the published register.</p>
<div class="frame">
<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="var(--font-sans), system-ui, sans-serif">
  <title id="ttl">Autonomous-vehicle stack steered by the epistemic-multiplex route-selector</title>
  <desc id="dsc">Sensors feed a trusted-substrate fusion gate, then manifold state estimation, phase identification and prediction. These feed a central epistemic-multiplex route-selector (AD-FORM) that emits a selected framework route which configures the formulation to planning to actuation proposer chain. All commands pass a risk-monotone algebra and a terminal hardware guard before reaching the vehicle. A mathematical-foundations layer underlies the whole stack.</desc>

  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

    </marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7F77DD"/>
    </marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D85A30"/>

    .chip  { fill: var(--color-background-primary); stroke: var(--color-border-tertiary); stroke-width: 1.25; }
    .chipt { fill: var(--color-text-secondary); font-size: 11px; font-weight: 600; }
    .eN    { stroke: var(--color-border-secondary); stroke-width: 1.5; fill: none; }
    .eV    { stroke: #7F77DD; stroke-width: 2; fill: none; }
    .eO    { stroke: #D85A30; stroke-width: 1.75; fill: none; }
    .lg    { fill: var(--color-text-secondary); font-size: 10px; }
    .node  { font-size: 12px; font-weight: 700; }

    <rect x="808" y="44" width="172" height="30" rx="15" class="chip"/><text x="894" y="63" text-anchor="middle" class="chipt">IMU</text>

  <text x="84" y="156" class="sub">Detection, segmentation, OOD</text>
  <text x="262" y="128" class="tag" text-anchor="end">①</text>

  <path class="eN" d="M510 74 V96 H660 V112" marker-end="url(#aN)"/>
  <path class="eN" d="M702 74 V112" marker-end="url(#aN)"/>

  <text x="214" y="414" text-anchor="middle" class="node" fill="#3C3489">F</text>

    <text x="308" y="426" class="sub">epistemic   P F S I E</text>
    <rect x="300" y="436" width="190" height="20" rx="4" fill="var(--color-background-primary)" stroke="var(--color-border-tertiary)"/>
    <text x="308" y="450" class="sub">applicability P F S I E</text>
  </g>

  <g>
    <text x="540" y="392" class="sub" font-weight="700">conditional selection (multilinear)</text>
    <text x="540" y="416" class="ttl" font-size="12.5px">P(r | 𝒮) ∝ 𝟙[r∈R_adm]·exp(β·Φ(r|𝒮))</text>
    <text x="540" y="436" class="sub">Φ = Σᵢ wᵢ·φ_sᵢ(𝒮) + λ·coherence</text>
    <text x="540" y="454" class="sub">r* = argmax  ·  325 ordered routes</text>
  </g>

  <text x="875" y="418" text-anchor="middle" class="ttl" font-size="12px" fill="#3C3489">r*  selected</text>

  <rect x="400" y="512" width="246" height="72" rx="10" class="mod"/>
  <text x="414" y="538" class="ttl">AD-PLAN · Planning</text>
  <text x="414" y="556" class="sub">Trajectory + feasibility cert</text>
  <text x="628" y="528" class="tag" text-anchor="end">⑥</text>

  <rect x="714" y="512" width="240" height="72" rx="10" class="mod"/>
  <rect x="714" y="512" width="240" height="72" rx="10" fill="#7F77DD" fill-opacity="0.07" stroke="#7F77DD" stroke-width="1.5"/>

  <text x="728" y="556" class="sub">Friction-circle command u</text>
  <text x="940" y="528" class="tag" text-anchor="end">S₃</text>

  <path class="eV" d="M520 470 V490 H523 V512" marker-end="url(#aV)"/>

  <rect x="404" y="640" width="226" height="46" rx="8" class="mod"/>
