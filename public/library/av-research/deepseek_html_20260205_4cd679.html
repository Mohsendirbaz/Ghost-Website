          {/* Flow arrows - Mercedes */}
          {[0,1,2,3,4,5].map(i => (
            <line key={i} x1={220 + i * 155} y1={183} x2={233 + i * 155} y2={183} 
              stroke="#64748b" strokeWidth={2} markerEnd="url(#arrow)"/>
          ))}

          {/* Data volume indicator */}
          <g transform="translate(80, 300)">
            <rect x={0} y={0} width={1070} height={25} rx={4} fill="#1e293b" stroke="#334155"/>
            <rect x={2} y={2} width={180} height={21} fill={`${colors.camera}40`}/>
            <rect x={182} y={2} width={150} height={21} fill={`${colors.radar}40`}/>
            <rect x={332} y={2} width={120} height={21} fill={`${colors.ultrasonic}40`}/>
            <rect x={452} y={2} width={300} height={21} fill={`${colors.fused}40`}/>
            <rect x={752} y={2} width={200} height={21} fill="#47556940"/>
            <rect x={952} y={2} width={116} height={21} fill="#22c55e40"/>
            
            <text x={92} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">~10⁸ px/s</text>
            <text x={257} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">~10⁶ pts/s</text>
            <text x={392} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">600 samp/s</text>
            <text x={602} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">~10⁴ features</text>
            <text x={852} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">~10³ states</text>
            <text x={1010} y={16} textAnchor="middle" fontSize="8" fill="#e2e8f0">~10¹ outputs</text>
          </g>

          {/* ===== DISSERTATION PARALLEL ===== */}
          {showDissertation && (
            <g>
              <text x={40} y={355} fontSize="14" fill={colors.dissertation} fontWeight="bold">DISSERTATION: BIOMASS GASIFICATION</text>
              
              {/* Stage 1: Raw Data */}
              <g transform="translate(80, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke={colors.dissertation} strokeWidth={2}/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill={colors.dissertation} fontWeight="bold">RAW DATA</text>
                
                <rect x={8} y={25} width={124} height={28} rx={2} fill="#14532d"/>
                <text x={70} y={38} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold">Elemental (5)</text>
                <text x={70} y={49} textAnchor="middle" fontSize="7" fill="#94a3b8">C, H, N, O, S wt%</text>
                
                <rect x={8} y={57} width={124} height={28} rx={2} fill="#14532d"/>
                <text x={70} y={70} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold">Proximate (3)</text>
                <text x={70} y={81} textAnchor="middle" fontSize="7" fill="#94a3b8">VM, FC, Ash wt%</text>
                
                <rect x={8} y={89} width={124} height={28} rx={2} fill="#14532d"/>
                <text x={70} y={102} textAnchor="middle" fontSize="8" fill="white" fontWeight="bold">Structural (3)</text>
                <text x={70} y={113} textAnchor="middle" fontSize="7" fill="#94a3b8">Cellulose, Hemi, Lignin</text>
                
                <rect x={8} y={121} width={124} height={32} rx={2} fill="#374151"/>
                <text x={70} y={136} textAnchor="middle" fontSize="8" fill="#94a3b8">+ Ash (10) + Op. cond.</text>
                <text x={70} y={148} textAnchor="middle" fontSize="7" fill="#64748b">25+ input parameters</text>
              </g>

              {/* Stage 2: Normalize */}
              <g transform="translate(235, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke="#475569"/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill="#94a3b8" fontWeight="bold">NORMALIZE</text>
                
                <rect x={10} y={30} width={120} height={55} rx={3} fill="#14532d"/>
                <text x={70} y={48} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Log Transform</text>
                <text x={70} y={64} textAnchor="middle" fontSize="8" fill="#67e8f9">log(X/C_ref)</text>
                <text x={70} y={78} textAnchor="middle" fontSize="7" fill="#94a3b8">Base carbon normalization</text>
                
                <rect x={10} y={93} width={120} height={55} rx={3} fill="#14532d"/>
                <text x={70} y={111} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Imputation</text>
                <text x={70} y={127} textAnchor="middle" fontSize="8" fill="#fcd34d">Missing values</text>
                <text x={70} y={141} textAnchor="middle" fontSize="7" fill="#94a3b8">200+ experimental sets</text>
              </g>

              {/* Stage 3: CCA */}
              <g transform="translate(390, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke="#475569"/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill="#94a3b8" fontWeight="bold">CCA VARIATES</text>
                
                <rect x={10} y={30} width={120} height={118} rx={3} fill="#14532d"/>
                <text x={70} y={48} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Canonical Pairs</text>
                
                <text x={70} y={68} textAnchor="middle" fontSize="8" fill="#fcd34d">(E₁, P₁) → ρ₁</text>
                <text x={70} y={84} textAnchor="middle" fontSize="8" fill="#c4b5fd">(E₁, S₁) → ρ₂</text>
                <text x={70} y={100} textAnchor="middle" fontSize="8" fill="#67e8f9">(P₁, S₁) → ρ₃</text>
                
                <text x={70} y={120} textAnchor="middle" fontSize="7" fill="#94a3b8">Max correlation</text>
                <text x={70} y={132} textAnchor="middle" fontSize="7" fill="#94a3b8">linear combinations</text>
              </g>

              {/* Stage 4: Geometric */}
              <g transform="translate(545, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke={colors.dissertation} strokeWidth={2}/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill={colors.dissertation} fontWeight="bold">GEOMETRIC</text>
                
                <rect x={10} y={30} width={120} height={118} rx={3} fill="#14532d"/>
                <text x={70} y={48} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Trigonometric</text>
                
                {/* Triangle visualization */}
                <polygon points="70,62 40,105 100,105" fill="none" stroke="#22c55e" strokeWidth={2}/>
                <circle cx={70} cy={62} r={4} fill="#fcd34d"/>
                <circle cx={40} cy={105} r={4} fill="#c4b5fd"/>
                <circle cx={100} cy={105} r={4} fill="#67e8f9"/>
                <circle cx={70} cy={85} r={25} fill="none" stroke="#475569" strokeWidth={1} strokeDasharray="2,2"/>
                
                <text x={70} y={122} textAnchor="middle" fontSize="8" fill="#a3e635">θ → (sin, cos, tan)</text>
                <text x={70} y={136} textAnchor="middle" fontSize="7" fill="#94a3b8">Unit circle → Triangle</text>
              </g>

              {/* Stage 5: Fibonacci */}
              <g transform="translate(700, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke="#475569"/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill="#94a3b8" fontWeight="bold">FIBONACCI</text>
                
                <rect x={10} y={30} width={120} height={118} rx={3} fill="#14532d"/>
                <text x={70} y={48} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Sequence Encode</text>
                
                <text x={70} y={70} textAnchor="middle" fontSize="8" fill="#67e8f9">Nⱼ → {'{'}F₁,F₂,...{'}'}</text>
                <text x={70} y={88} textAnchor="middle" fontSize="8" fill="#fcd34d">Centric differences</text>
                
                <text x={70} y={110} textAnchor="middle" fontSize="8" fill="#a3e635">sct: specific</text>
                <text x={70} y={124} textAnchor="middle" fontSize="8" fill="#a3e635">computational time</text>
                <text x={70} y={140} textAnchor="middle" fontSize="7" fill="#94a3b8">Non-equilibrium factor</text>
              </g>

              {/* Stage 6: Neural Network */}
              <g transform="translate(855, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke={colors.dissertation} strokeWidth={2}/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill={colors.dissertation} fontWeight="bold">NEURAL NET</text>
                
                <rect x={10} y={30} width={120} height={118} rx={3} fill="#14532d"/>
                <text x={70} y={45} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">ABT Network</text>
                
                {/* Neural network visualization */}
                <g transform="translate(25, 55)">
                  {[0,1,2].map(i => <circle key={`i${i}`} cx={0} cy={i * 22} r={5} fill="#67e8f9"/>)}
                  {[0,1,2,3].map(i => <circle key={`h${i}`} cx={45} cy={i * 18 - 5} r={5} fill="#fcd34d"/>)}
                  {[0,1].map(i => <circle key={`o${i}`} cx={90} cy={i * 25 + 10} r={5} fill="#22c55e"/>)}
                  {/* Connections */}
                  {[0,1,2].map(i => [0,1,2,3].map(j => (
                    <line key={`c1-${i}-${j}`} x1={5} y1={i*22} x2={40} y2={j*18-5} stroke="#475569" strokeWidth={0.5}/>
                  )))}
                  {[0,1,2,3].map(i => [0,1].map(j => (
                    <line key={`c2-${i}-${j}`} x1={50} y1={i*18-5} x2={85} y2={j*25+10} stroke="#475569" strokeWidth={0.5}/>
                  )))}
                </g>
                
                <text x={70} y={130} textAnchor="middle" fontSize="8" fill="#f472b6">tanh activation</text>
                <text x={70} y={142} textAnchor="middle" fontSize="7" fill="#94a3b8">Characteristic matrix</text>
              </g>

              {/* Stage 7: Output */}
              <g transform="translate(1010, 370)">
                <rect x={0} y={0} width={140} height={160} rx={5} fill="#1e293b" stroke="#22c55e" strokeWidth={2}/>
                <text x={70} y={18} textAnchor="middle" fontSize="10" fill="#22c55e" fontWeight="bold">PREDICTION</text>
                
                <rect x={10} y={30} width={120} height={118} rx={3} fill="#14532d"/>
                <text x={70} y={45} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">Gas Composition</text>
                
                <text x={30} y={62} textAnchor="start" fontSize="8" fill="#fcd34d">H₂</text>
                <rect x={50} y={54} width={60} height={6} fill="#fcd34d" opacity={0.7}/>
                
                <text x={30} y={76} textAnchor="start" fontSize="8" fill="#c4b5fd">CO</text>
                <rect x={50} y={68} width={52} height={6} fill="#c4b5fd" opacity={0.7}/>
                
                <text x={30} y={90} textAnchor="start" fontSize="8" fill="#67e8f9">CO₂</text>
                <rect x={50} y={82} width={38} height={6} fill="#67e8f9" opacity={0.7}/>
                
                <text x={30} y={104} textAnchor="start" fontSize="8" fill="#a3e635">CH₄</text>
                <rect x={50} y={96} width={25} height={6} fill="#a3e635" opacity={0.7}/>
                
                <text x={70} y={120} textAnchor="middle" fontSize="8" fill="#f472b6">Yield (Nm³/kg)</text>
                <text x={70} y={134} textAnchor="middle" fontSize="8" fill="#fb923c">CCE %</text>
              </g>

              {/* Flow arrows - Dissertation */}
              {[0,1,2,3,4,5].map(i => (
                <line key={`d${i}`} x1={220 + i * 155} y1={450} x2={233 + i * 155} y2={450} 
                  stroke={colors.dissertation} strokeWidth={2} markerEnd="url(#arrowGreen)"/>
              ))}

              {/* Dissertation data volume */}
              <g transform="translate(80, 545)">
                <rect x={0} y={0} width={1070} height={22} rx={4} fill="#1e293b" stroke={colors.dissertation}/>
                <rect x={2} y={2} width={200} height={18} fill="#14532d"/>
                <rect x={202} y={2} width={180} height={18} fill="#16532d90"/>
                <rect x={382} y={2} width={180} height={18} fill="#16532d70"/>
                <rect x={562} y={2} width={180} height={18} fill="#16532d50"/>
                <rect x={742} y={2} width={180} height={18} fill="#16532d30"/>
                <rect x={922} y={2} width={146} height={18} fill="#22c55e40"/>
                
                <text x={102} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">25+ params</text>
                <text x={292} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">Normalized</text>
                <text x={472} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">4 variates</text>
                <text x={652} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">Composite Nⱼ</text>
                <text x={832} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">Char. matrix</text>
                <text x={995} y={15} textAnchor="middle" fontSize="8" fill="#e2e8f0">6 outputs</text>
              </g>
            </g>
          )}

          {/* Summary box */}
          <g transform="translate(80, 585)">
            <rect x={0} y={0} width={1070} height={95} rx={8} fill="#1e293b" stroke="#475569"/>
            <text x={535} y={22} textAnchor="middle" fontSize="12" fill="#e2e8f0" fontWeight="bold">
              DATA REDUCTION LIFECYCLE COMPARISON
            </text>
            
            <line x1={535} y1={30} x2={535} y2={85} stroke="#475569" strokeWidth={1} strokeDasharray="4,2"/>
            
            <text x={268} y={45} textAnchor="middle" fontSize="10" fill={colors.fused}>MERCEDES</text>
            <text x={268} y={60} textAnchor="middle" fontSize="9" fill="#94a3b8">27 sensors → 10⁸ samples/s → 10⁴ features → 10² objects → ~10 outputs</text>
            <text x={268} y={78} textAnchor="middle" fontSize="9" fill="#67e8f9">Compression: ~10⁷:1 (real-time, 10Hz control loop)</text>
            
            <text x={802} y={45} textAnchor="middle" fontSize="10" fill={colors.dissertation}>DISSERTATION</text>
            <text x={802} y={60} textAnchor="middle" fontSize="9" fill="#94a3b8">25+ properties → 4 CCA variates → 1 char. matrix → 6 predictions</text>
            <text x={802} y={78} textAnchor="middle" fontSize="9" fill="#a3e635">Compression: ~25:6 (batch processing, offline training)</text>
          </g>
        </svg>

        {/* Stage Info Panel */}
        {activeStage && stageInfo[activeStage] && (
          <div className="mt-4 bg-slate-800 rounded-lg p-4 border border-slate-600">
            <h3 className="text-lg font-bold text-white mb-2">{stageInfo[activeStage].title}</h3>
            <div className="grid md:grid-cols-2 gap-4">
              <div className="bg-slate-700 p-3 rounded">
                <h4 className="text-sm font-semibold text-blue-400 mb-1">Mercedes Pipeline</h4>
                <p className="text-sm text-slate-300">{stageInfo[activeStage].mercedes}</p>
              </div>
              <div className="bg-slate-700 p-3 rounded">
                <h4 className="text-sm font-semibold text-green-400 mb-1">Dissertation Pipeline</h4>
                <p className="text-sm text-slate-300">{stageInfo[activeStage].dissertation}</p>
              </div>
            </div>
            <div className="mt-2 pt-2 border-t border-slate-600">
              <span className="text-xs text-slate-400">Data Structure: </span>
              <span className="text-xs text-yellow-400">{stageInfo[activeStage].dataStructure}</span>
            </div>
          </div>
        )}

        {/* Key Insights */}
        <div className="mt-4 bg-slate-800 rounded-lg p-4">
          <h3 className="font-bold text-white mb-3">Structural Parallels in Data Reduction</h3>
          <div className="grid md:grid-cols-4 gap-3 text-sm">
            <div className="bg-slate-700 p-3 rounded">
              <div className="text-orange-400 font-semibold mb-1">Heterogeneous Input</div>
              <p className="text-slate-300 text-xs">
                Both start with diverse modalities: 3 sensor types vs. 4 characterization methods.
              </p>
            </div>
            <div className="bg-slate-700 p-3 rounded">
              <div className="text-purple-400 font-semibold mb-1">Canonical Fusion</div>
              <p className="text-slate-300 text-xs">
                Multi-modal fusion (Mercedes) ↔ CCA variates (Dissertation): extract maximal joint information.
              </p>
            </div>
            <div className="bg-slate-700 p-3 rounded">
              <div className="text-cyan-400 font-semibold mb-1">Temporal Encoding</div>
              <p className="text-slate-300 text-xs">
                Kalman filter state prediction ↔ Fibonacci sequence / sct: capture dynamics via recurrence.
              </p>
            </div>
            <div className="bg-slate-700 p-3 rounded">
              <div className="text-green-400 font-semibold mb-1">Consensus Output</div>
              <p className="text-slate-300 text-xs">
                8/10 AI voting (Mercedes) ↔ NN ensemble validation: robust predictions from reduced models.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

      // Mount
      ReactDOM.createRoot(document.getElementById("root")).render(<SensorDataLifecycle />);
    </script>
  </body>
